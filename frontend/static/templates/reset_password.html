<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>FastAPI Blog - Reset Password</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
                rel="stylesheet"
                integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
                crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    </head>
    <body>
        <div class="container mt-4" id="app-container">
            <div class="content-section py-3 px-4 mb-4 card mx-auto" style="max-width: 500px;">
                <h2 class="mb-4">Reset Password</h2>
                <p id="missingTokenMessage" class="invalid-feedback d-none">
                    This reset link is invalid or incomplete. Please request a new one.
                </p>
                <p class="text-body-secondary mb-4">Enter your new password below.</p>
                <form id="resetPasswordform">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password"
                               class="form-control"
                               id="newPassword"
                               name="new_password"
                               required 
                               minlength="8">
                        <div class="form-text">Password must be at least 8 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <input type="password"
                               class="form-control"
                               id="confirmNewPassword"
                               name="confirm_password"
                               required
                               minlength="8">
                        <div id="passwordError" class="invalid-feedback d-none">Passwords do not match.</div>
                    </div>
                    <p id="formError" class="invalid-feedback d-none"></p>
                    <p id="formSuccess" class="sucess-msg"></p>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
                </form>

                <div class="mt-3 text-center">
                    <p class="mb-0">Remember you password? <a href="/login.html">Login here</a></p>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="/static/js/reset-password.js"></script>
    </body>
</html>
