<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastAPI Blog</title>
    <meta name="author" content="Aikins">
    <meta property="og:title" content="FastAPI Blog">
    <meta property="og:type" content="website">
    <meta property="og:image" content="">
    <meta property="og:url" content="">
    <meta property="og:image:alt" content="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <meta name="theme-color" content="#527c9f">
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/home.html">SecureBlog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/static/templates/index.html">Home</a></li>
                    <li class="nav-item author-only" style="display:none;"><a class="nav-link" href="/static/templates/author.html">Author Dashboard</a></li>
                    <li class="nav-item admin-only" style="display:none;"><a class="nav-link" href="/static/templates/admin.html">Admin Panel</a></li>
                    <li class="nav-item guest-only" style="display:none;"><a class="nav-link" href="/static/templates/login.html">Login</a></li>
                    <li class="nav-item guest-only" style="display:none;"><a class="nav-link" href="/static/templates/signup.html">Sign Up</a></li>
                    <li class="nav-item authenticated" style="display:none;">
                        <a class="nav-link" href="/static/templates/profile.html">Profile</a>
                    </li>
                    <li class="nav-item authenticated" style="display:none;">
                        <button class="btn btn-sm btn-danger" id="logoutBtn">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4" id="app-container">
        <div id="loadingSpinner" class="spinner-border text-primary" role="status" style="display:none;">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="alertContainer"></div>

        <div id="blogs-page" class="page-content">
            <h2>All Blogs</h2>
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search blogs...">
            </div>
            <div id="blogs-list" class="row"></div>
        </div>

        <div id="blog-detail-page" class="page-content" style="display:none;">
            <button class="btn btn-secondary mb-3" id="backToBlogsBtn">← Back</button>
            <div id="blog-content"></div>
            <div id="comments-section"></div>
            <div id="likes-section"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/home.js"></script>
</body>
</html>
