<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>FastAPI Blog - Forgot Password</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
                rel="stylesheet"
                integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
                crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    </head>
<body>
    <div class="container mt-4" id="app-container">
        <div class="content-section py-3 px-4 mb-4 card mx-auto" style="max-width: 500px;">
            <h2 class="mb-4">Forgot Password</h2>
            <p class="text-body-secondary mb-4">Enter you email address and we'll send you a link to reset your password.</p>
            <form id="forgotPasswordForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           required>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Account Type</label>
                    <select id="role" 
                            name="role" 
                            class="form-select"
                            required>
                        <option value="user">User</option>
                        <option value="author">Author</option>
                    </select>
                </div>
                <p id="formError" class="invalid-feedback d-none"></p>
                <p id="formSuccess" class="success-msg"></p>
                <button type="submit" class="btn btn-primary" id="submitBtn">Send Reset Link</button>
            </form>

            <div class="mt-3 text-center">
                <p class="mb-0">Remeber your password? <a href="/login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/forgot-password.js"></script>
</body>
</html>
