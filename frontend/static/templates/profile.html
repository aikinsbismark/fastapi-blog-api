<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

  <div id="guardLoading" class="text-center py-5">Loading...</div>

  <div id="app" style="display: none;">
    <nav class="navbar navbar-expand bg-body-tertiary mb-4">
      <div class="container">
        <a class="navbar-brand" href="/static/templates/index.html">Blog</a>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Log out</button>
      </div>
    </nav>

    <main class="container" style="max-width: 720px;">

      <section class="text-center mb-4">
        <img id="profilePicture" src="/static/images/default-avatar.svg" alt="Profile picture"
             class="rounded-circle mb-2" width="110" height="110" style="object-fit: cover;">
        <h1 id="displayUsername" class="h4 mb-0"></h1>
        <p id="displayEmail" class="text-muted"></p>
      </section>

      <section class="card mb-4">
        <div class="card-body">
          <h2 class="h5">Profile details</h2>
          <form id="updateProfileForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div id="profileFormError" class="alert alert-danger d-none"></div>
            <p id="profileFormSuccess" class="text-success"></p>
            <button id="updateProfileBtn" type="submit" class="btn btn-primary">Update Profile</button>
          </form>
        </div>
      </section>

      <section class="card mb-4">
        <div class="card-body">
          <h2 class="h5">Profile picture</h2>
          <input type="file" id="pictureInput" class="form-control mb-3" accept="image/*">
          <img id="imagePreview" class="d-none mb-3 rounded" alt="Preview" width="110" height="110"
               style="object-fit: cover;">
          <div id="pictureError" class="alert alert-danger d-none"></div>
          <p id="pictureSuccess" class="text-success"></p>
          <button id="uploadPictureBtn" type="button" class="btn btn-primary" disabled>Upload</button>
        </div>
      </section>

      <section class="card mb-4">
        <div class="card-body">
          <h2 class="h5">Change password</h2>
          <form id="changePasswordForm">
            <div class="mb-3">
              <label for="currentPassword" class="form-label">Current password</label>
              <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="newPassword" class="form-label">New password</label>
              <input type="password" id="newPassword" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="confirmNewPassword" class="form-label">Confirm new password</label>
              <input type="password" id="confirmNewPassword" class="form-control" required>
              <div id="passwordError" class="invalid-feedback d-none" style="display: block;">
                Passwords do not match.
              </div>
            </div>
            <div id="formError" class="alert alert-danger d-none"></div>
            <p id="formSuccess" class="text-success"></p>
            <button id="changePasswordBtn" type="submit" class="btn btn-primary">Change Password</button>
          </form>
        </div>
      </section>

      <section class="card border-danger mb-5">
        <div class="card-body">
          <h2 class="h5 text-danger">Delete account</h2>
          <p>This permanently deletes your account and cannot be undone.</p>
          <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                  data-bs-target="#deleteAccountModal">Delete Account</button>
        </div>
      </section>
    </main>

    <div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Delete your account?</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">This action is permanent.</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="confirmDeleteAccount" class="btn btn-danger">Delete Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/ui-controls.js" defer></script>
  <script type="module" src="/static/js/account.js"></script>
</body>
</html>
